plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mediamuxer'
version = '1.0.0'

android {
  namespace "expo.modules.mediamuxer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  // expo-video ships prebuilt; compile against the same artifact the app uses
  maven { url "${rootProject.projectDir}/../node_modules/expo-video/local-maven-repo" }
}

dependencies {
  // already in the app — only needed to compile pinVideoHeight against them
  compileOnly "host.exp.exponent:expo.modules.video:58.0.11"
  compileOnly "androidx.media3:media3-exoplayer:1.9.1"
  compileOnly "androidx.media3:media3-common:1.9.1"
}
